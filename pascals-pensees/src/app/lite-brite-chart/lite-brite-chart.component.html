      <mat-label>Search pensées text</mat-label>

    </mat-form-field> -->
    <!-- <mat-icon class="search-icon">search</mat-icon> -->
    <mat-icon id="refresh-icon" (click)="refreshLiteBrites()">refresh</mat-icon>
    <div class="tooltip"></div>
    <div id="subcontainer">
        <div #chart id="chart"></div>
        <div>
          <div #clusterScatterplot id="cluster-scatterplot" [class.hidden]="isTextViewerExpanded"></div>
          <div id="text-viewer" [class.expanded]="isTextViewerExpanded">
            <div class="text-viewer-header">
              <mat-icon class="expand-icon" (click)="toggleTextViewer()" [title]="isTextViewerExpanded ? 'Collapse' : 'Expand'">
                {{ isTextViewerExpanded ? 'unfold_less' : 'unfold_more' }}
              </mat-icon>
              <div class="info-icon">
                <mat-icon [title]="'Information'">info_outline</mat-icon>
                <div class="info-tooltip">
                  {{message}}
                </div>
              </div>
            </div>
            <div class="text-viewer-content" (click)="refreshLiteBrites()">
            </div>
          </div>
        </div>
    </div>
</div>
