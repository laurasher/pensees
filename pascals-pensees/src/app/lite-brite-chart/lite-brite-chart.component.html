<div id="container">
    <!-- Search Bar -->
    <div id="search-container">
        <input 
            type="text" 
            id="search-input" 
            placeholder="Search pensées..." 
            [(ngModel)]="searchTerm"
            (input)="searchPensees()"
        />
        <mat-icon *ngIf="searchTerm" id="clear-icon" (click)="clearSearch()">close</mat-icon>
    </div>

      <mat-label>Search pensées text</mat-label>
      <input type="text" matInput [(ngModel)]="filterBy">
    </mat-form-field> -->
    <!-- <mat-icon class="search-icon">search</mat-icon> -->
    <mat-icon id="refresh-icon" (click)="refreshLiteBrites()">refresh</mat-icon>
    <div class="tooltip"></div>
    <div id="subcontainer">
        <div #chart id="chart"></div>
        <div>
          <div #clusterScatterplot id="cluster-scatterplot"></div>
          <div id="text-viewer" (click)="refreshLiteBrites()">
            <i>{{message}}</i><br><br>
          </div>
        </div>
    </div>
</div>
