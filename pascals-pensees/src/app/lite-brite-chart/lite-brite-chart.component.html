<div id="container">
    <div id="search-container">
        <mat-icon class="search-icon">search</mat-icon>
        <input 
            type="text" 
            id="search-input" 
            placeholder="Search pensées by text, fragment index, or number..."
            [(ngModel)]="searchTerm"
            (input)="searchPensees()"
        />
        <mat-icon 
            id="clear-icon" 
            (click)="clearSearch()"
            *ngIf="searchTerm"
        >close</mat-icon>
    </div>
    <div id="cluster-pills-container">
        <div class="cluster-pill-label">Clusters:</div>
        <div 
            *ngFor="let cluster of clusters" 
            class="cluster-pill"
            [class.active]="isClusterSelected(cluster)"
            [style.background-color]="isClusterSelected(cluster) ? getClusterColor(cluster) : '#e0e0e0'"
            (click)="toggleCluster(cluster)"
        >
            {{ cluster }}
        </div>
        <button class="reset-zoom-btn" (click)="resetZoom()" title="Reset zoom">
            <mat-icon>zoom_out_map</mat-icon>
        </button>
    </div>
    <mat-icon id="refresh-icon" (click)="refreshLiteBrites()">refresh</mat-icon>
    <div class="tooltip"></div>
    <div id="subcontainer">
        <div #chart id="chart"></div>
        <div id="text-viewer" (click)="refreshLiteBrites()"><i>{{message}}</i><br><br></div>
    </div>
</div>
