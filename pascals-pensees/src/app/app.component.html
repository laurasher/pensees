<link rel="stylesheet" href="https://use.typekit.net/pjc2sqf.css">
<div class="main-page-content">
    <div id="titles-top-half">
        <div id="title-row">
            <p id="main-page-title">{{ title }}</p>
            <div id="header-controls">
                <!-- Search Bar -->
                <div id="search-container">
                    <input
                        type="text"
                        id="search-input"
                        placeholder="Search pensées..."
                        [(ngModel)]="liteBriteChart.searchTerm"
                        (ngModelChange)="liteBriteChart.searchPensees()"
                    />
                    <mat-icon *ngIf="liteBriteChart?.searchTerm" id="clear-icon" (click)="liteBriteChart.clearSearch()">close</mat-icon>
                </div>
                <!-- Cluster Filter Pills -->
                <div id="cluster-pills-container">
                    <div id="cluster-pills-header">
                        <span id="cluster-pills-label">Toggle thematic clusters</span>
                        <div id="cluster-pills-actions">
                            <button class="cluster-action" aria-label="Select all thematic clusters" (click)="liteBriteChart?.selectAllClusters()">Select All</button>
                            <button class="cluster-action" aria-label="Deselect all thematic clusters" (click)="liteBriteChart?.resetClusterFilters()">Deselect All</button>
                        </div>
                    </div>
                    <div id="cluster-pills-grid">
                        <div
                            *ngFor="let cluster of liteBriteChart?.clusters"
                            class="cluster-pill"
                            [class.active]="liteBriteChart?.isClusterActive(cluster)"
                            [style.background-color]="liteBriteChart?.isClusterActive(cluster) ? liteBriteChart?.getClusterColor(cluster) : '#e0e0e0'"
                            [style.--cluster-color]="liteBriteChart?.getClusterColor(cluster)"
                            (click)="liteBriteChart?.toggleClusterFilter(cluster)">
                            {{ cluster + 1 }}
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- <p id="main-page-subtitle">{{ subtitle }}</p> -->
        <p id="main-page-instructions">{{ instructions }}</p>
    </div>
    <div id="charts-bottom-half">
        <app-lite-brite-chart #liteBriteChart [data]="data | async" class="column"></app-lite-brite-chart>
        <!-- <app-pensees-display  class="column"></app-pensees-display> -->
    </div>
</div>

<!-- Pensées Drawer Toggle Button -->
<button class="drawer-toggle" [class.open]="isDrawerOpen" [attr.aria-expanded]="isDrawerOpen" (click)="toggleDrawer()" aria-label="Toggle pensées drawer">
    <mat-icon>{{ isDrawerOpen ? 'chevron_right' : 'menu_book' }}</mat-icon>
</button>

<!-- Pensées Drawer -->
<div class="pensees-drawer" [class.open]="isDrawerOpen" role="complementary" aria-label="Pensées drawer">
    <div class="pensees-drawer-content">
        <div
            *ngFor="let pensee of penseesList"
            class="pensee-card"
            [ngStyle]="getPenseeCardStyle(pensee.cluster)">
            <p>{{ pensee.corpus }}</p>
        </div>
    </div>
</div>
