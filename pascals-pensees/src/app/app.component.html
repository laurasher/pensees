<div class="zipper-layout">
    <div class="stripe-drawer" role="complementary" aria-label="Pensées stripe drawer">
        <div class="stripe-scroll">
            <div class="stripe-track">
                <div
                    *ngFor="let pensee of filteredPenseesList"
                    class="stripe-fragment"
                    [class.selected]="isStripeFragmentSelected(pensee.fragment_index)"
                    [ngStyle]="getStripeFragmentStyle(pensee)">
                </div>
            </div>
        </div>
    </div>

    <div class="text-view">
        <div class="pensees-drawer-content">
            <div
                *ngFor="let pensee of filteredPenseesList"
                class="pensee-card"
                [class.selected]="selectedFragmentIndex === pensee.fragment_index"
                [ngStyle]="getPenseeCardStyle(pensee.cluster)"
                (click)="onPenseeSelect(pensee)">
                <p>{{ pensee.corpus }}</p>
            </div>
        </div>
    </div>
</div>
